name: Build and deploy Node.js app to Azure Web App - storonnimv-client

on:
  push:
    branches:
      - server/azure
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies and build
        run: |
          npm install
          npm run build --if-present
        working-directory: storonnimv.client

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-app
          path: storonnimv.client/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_030BF16164A245E2842AC84F4CFB884F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1CEB8EA777394380927A7B085A5CA019 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_68A9F107DE494579BC3C324BDE149D33 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'storonnimv-client'
          slot-name: 'Production'
          package: .
